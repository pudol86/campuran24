  <style>
    :root{
      --bg:#000000; --text:#f4f4f5; --muted:#a1a1aa; --line:#27272a; --card:#0a0a0a;
      --accent:#ef4444; --accent2:#f97316;
      color-scheme:dark;
    }

    /* ===== RESET & BASE ===== */
    *,*::before,*::after{ box-sizing:border-box }
    html{ -webkit-text-size-adjust:100%; background:#000 }
    html,body{ height:100%; margin:0 }
    body{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
      color:var(--text); background:var(--bg); line-height:1.45;
      overflow-x:hidden;
    }
    img,video,canvas,svg,iframe{ max-width:100%; height:auto; display:block }

    /* ===== APP BAR ===== */
    .appbar{
      position:sticky; top:0; z-index:20; background:rgba(0,0,0,.85);
      backdrop-filter:saturate(180%) blur(8px); -webkit-backdrop-filter:saturate(180%) blur(8px);
      border-bottom:1px solid var(--line);
    }
    .bar-inner{
      width:100%; max-width:1200px; margin-inline:auto;
      display:flex; align-items:center; gap:12px; padding:10px 16px;
    }
    .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.2px }
    .logo{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:6px; background:#fff; color:#000; font-size:14px; font-weight:800 }
    .spacer{ flex:1 }
    .btn{ appearance:none; border:0; padding:10px 14px; border-radius:12px; background:#fff; color:#000; font:inherit; font-weight:700; cursor:pointer; touch-action:manipulation }
    .btn:hover{ background:#e4e4e7 }

    /* ===== BANNER INFO ===== */
    .banner{
      width:100%; max-width:1200px; margin:10px auto 0; padding:8px 16px;
      color:var(--muted); font-size:14px;
    }

    /* ===== SLOT IKLAN BANNER (otomatis tersembunyi jika kosong) ===== */
    .ad-banner{
      width:100%; max-width:760px; margin:10px auto 0; padding-inline:16px;
      display:flex; justify-content:center; align-items:center; overflow:hidden;
    }
    .ad-banner:empty{ display:none }
    .ad-banner > *{ max-width:100% }

    /* ===== LAYOUT ===== */
    .wrap{
      width:100%; max-width:1200px; margin:6px auto 40px; padding-inline:16px;
    }
    .player-shell{ display:grid; place-items:center; margin-top:16px }

    .phone{
      position:relative;
      width:clamp(240px, 92vw, 420px);
      aspect-ratio:9/16;
      border-radius:22px; overflow:hidden; background:#000;
      border:1px solid var(--line);
      box-shadow:0 10px 40px rgba(255,255,255,.04), 0 3px 12px rgba(0,0,0,.6);
    }
    .phone video,.phone img{ width:100%; height:100%; object-fit:cover }

    .meta{
      width:100%; max-width:760px; margin:22px auto 0; padding:0 6px;
      text-align:center; color:var(--muted); font-size:13px;
    }
    .player-shell .ad-banner{ margin-top:22px; padding-inline:0 }

    @media (min-width:1024px){
      .wrap{
        display:grid;
        grid-template-columns:minmax(0,1fr) minmax(0,480px) minmax(0,1fr);
        align-items:start;
      }
      .player-shell{ grid-column:2 }
    }

    /* ===== POPUP KONFIRMASI USIA ===== */
    .age-backdrop{
      position:fixed; inset:0; z-index:9999; display:grid; place-items:center; padding:16px;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity .2s ease, visibility .2s ease;
    }
    .age-backdrop.show{ opacity:1; visibility:visible; pointer-events:auto }
    .age-dialog{
      width:min(400px, 94vw); text-align:center;
      padding:30px 24px 20px; border-radius:24px;
      background:linear-gradient(180deg,#18181b,#09090b);
      border:1px solid #2a2a30;
      box-shadow:0 30px 80px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.04);
      transform:translateY(14px) scale(.97);
      transition:transform .22s ease;
    }
    .age-backdrop.show .age-dialog{ transform:none }
    .age-badge{
      width:72px; height:72px; margin:0 auto 18px; border-radius:50%;
      display:grid; place-items:center; color:#fff; font-weight:800; font-size:23px; letter-spacing:-.5px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 10px 30px rgba(239,68,68,.35);
    }
    .age-title{ margin:0 0 8px; font-size:21px; font-weight:800; color:#fff }
    .age-text{ margin:0 0 24px; font-size:14px; line-height:1.65; color:var(--muted) }
    .age-actions{ display:flex; flex-direction:column; gap:6px }
    .age-btn-primary{
      display:flex; align-items:center; justify-content:center; gap:10px;
      height:52px; border:0; border-radius:14px; text-decoration:none; cursor:pointer;
      font:inherit; font-weight:700; font-size:15px; color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 10px 26px rgba(239,68,68,.30);
      transition:transform .15s ease, filter .15s ease;
    }
    .age-btn-primary:hover{ filter:brightness(1.08); transform:translateY(-1px) }
    .age-btn-primary:active{ transform:translateY(0) }
    .age-btn-primary svg{ width:16px; height:16px; fill:#fff; flex:none }
    .age-btn-secondary{
      appearance:none; background:transparent; border:0; cursor:pointer;
      padding:12px; font:inherit; font-size:13px; font-weight:600; color:var(--muted);
    }
    .age-btn-secondary:hover{ color:#fff }
    :focus-visible{ outline:2px solid #60a5fa; outline-offset:3px }
    @media (prefers-reduced-motion:reduce){ *{ transition:none !important } }

  <!-- ===== PEMUTAR + VIDEO BERGANTI OTOMATIS ===== -->
  <script>
    const v = document.getElementById('video');
    const meta = document.getElementById('metaTime');
    function fmt(t){ if(!isFinite(t)) return '--:--'; const m = Math.floor(t/60); const s = Math.floor(t%60).toString().padStart(2,'0'); return `${m}:${s}`; }
    v.addEventListener('loadedmetadata', ()=>{ meta.textContent = `0:00 / ${fmt(v.duration)}`; });
    v.addEventListener('timeupdate',     ()=>{ meta.textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`; });

    const VIDEO_LIST_URL = "videos.txt";   // daftar link, satu link per baris
    const AUTO_NEXT      = true;           // true = setelah selesai otomatis lanjut ke video berikutnya
    const FALLBACK_LIST  = ["https://cdn.aceimg.com/dAb0N7A6i.mp4"]; // dipakai jika videos.txt gagal dimuat
    const QUEUE_KEY      = "video_queue_v1";

    let LIST = [];

    function hashList(list){
      const s = list.join("|"); let h = 0;
      for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
      return h + ":" + list.length;
    }
    function shuffle(a){
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }
    function readState(){
      try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || "null"); }catch(e){ return null; }
    }
    function writeState(s){
      try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(s)); }catch(e){}
    }

    // Antrean acak per pengunjung: semua video tampil dulu sebelum ada yang berulang
    function nextVideo(){
      if(LIST.length === 1) return LIST[0];
      const sig = hashList(LIST);
      let st = readState();
      const lastShown = (st && st.sig === sig && typeof st.lastShown === "number") ? st.lastShown : -1;

      if(!st || st.sig !== sig || !Array.isArray(st.order) || st.pos >= st.order.length){
        const order = shuffle(LIST.map((_,i)=>i));
        if(order[0] === lastShown){ [order[0],order[1]] = [order[1],order[0]]; }
        st = { sig, order, pos:0, lastShown };
      }
      const idx = st.order[st.pos++];
      st.lastShown = idx;
      writeState(st);
      return LIST[idx];
    }

    function parseList(text){
      const seen = new Set();
      return text.split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#") && /^https?:\/\//i.test(l))
        .filter(l => !seen.has(l) && seen.add(l));
    }

    async function initVideo(){
      try{
        const res = await fetch(VIDEO_LIST_URL, { cache:"no-cache" });
        if(!res.ok) throw new Error("HTTP " + res.status);
        LIST = parseList(await res.text());
      }catch(e){
        LIST = [];
      }
      if(!LIST.length) LIST = FALLBACK_LIST.slice();
      v.src = nextVideo();
      v.load();
    }

    v.addEventListener("ended", ()=>{
      if(!AUTO_NEXT || LIST.length < 2) return;
      v.src = nextVideo();
      v.play().catch(()=>{});
    });

    initVideo();
  </script>

  <!-- ===== BAHASA OTOMATIS: Indonesia untuk pengunjung dari Indonesia, Inggris untuk negara lain ===== -->
  <script>
  (function(){
    const I18N = {
      id: {
        upload:    "Unggah",
        advertise: "Pasang Iklan",
        hint:      "Tekan putar untuk memulai",
        noVideo:   "Browser kamu tidak mendukung pemutar video HTML5.",
        ageTitle:  "Konfirmasi Usia",
        ageText:   "Konten ini ditujukan untuk penonton berusia 18 tahun ke atas. Dengan melanjutkan, Anda menyatakan telah berusia 18+.",
        cont:      "Lanjutkan Menonton",
        cancel:    "Batal"
      },
      en: {
        upload:    "Upload",
        advertise: "Advertise",
        hint:      "Press play to start",
        noVideo:   "Your browser does not support HTML5 video.",
        ageTitle:  "Age Confirmation",
        ageText:   "This content is intended for viewers aged 18 and over. By continuing, you confirm that you are 18 or older.",
        cont:      "Continue Watching",
        cancel:    "Cancel"
      }
    };

    const GEO_URL  = "https://get.geojs.io/v1/ip/country.json";
    const LANG_KEY = "site_lang_geo";

    function setLang(lang){
      if(!I18N[lang]) lang = "en";
      const d = I18N[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el=>{
        const k = el.getAttribute("data-i18n");
        if(d[k]) el.textContent = d[k];
      });
    }
    function guessLang(){
      return ((navigator.language || "").toLowerCase().indexOf("id") === 0) ? "id" : "en";
    }
    function cached(){ try{ return sessionStorage.getItem(LANG_KEY); }catch(e){ return null; } }
    function remember(l){ try{ sessionStorage.setItem(LANG_KEY, l); }catch(e){} }

    async function detectLang(){
      try{
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), 3000);
        const res = await fetch(GEO_URL, { signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        if(data && data.country){
          const l = (String(data.country).toUpperCase() === "ID") ? "id" : "en";
          remember(l);
          return l;
        }
      }catch(e){}
      return guessLang();
    }

    // Tampilkan dulu bahasa perkiraan (cache / bahasa browser), lalu sesuaikan dengan negara asli
    setLang(cached() || guessLang());
    if(!cached()) detectLang().then(setLang);
  })();
  </script>

  <script>
  (function(){
    /* ================== KONFIG ================== */
    // Tempel direct link Monetag Anda di bawah ini (isi bawaan = link lama dari file Anda).
    const MONETAG_DIRECT_LINK = "https://yananrenovel.com/ixVqpAD4OHho2yW3/137253";
    const AUTO_SHOW_DELAY_MS  = 15000;  // popup muncul setelah 15 detik
    const REMEMBER_TTL_MIN    = 10;    // tidak muncul lagi selama 120 menit setelah ditutup
    /* ============================================ */

    const backdrop = document.getElementById("age-backdrop");
    const btnGo    = document.getElementById("age-continue");
    const btnNo    = document.getElementById("age-cancel");
    const vid      = document.getElementById("video");

    // Direct link dipasang langsung di tombol (anchor asli, tidak mudah diblokir browser)
    if(MONETAG_DIRECT_LINK){ btnGo.href = MONETAG_DIRECT_LINK; }

    function lockScroll(on){ document.documentElement.style.overflow = document.body.style.overflow = on ? "hidden" : ""; }
    function showModal(){
      if(!vid.paused && !vid.ended){ vid.pause(); }
      backdrop.classList.add("show");
      backdrop.setAttribute("aria-hidden","false");
      lockScroll(true);
      try{ btnGo.focus({ preventScroll:true }); }catch(e){}
    }
    function closeModal(){
      backdrop.classList.remove("show");
      backdrop.setAttribute("aria-hidden","true");
      lockScroll(false);
    }
    function rememberSkip(){ try{ localStorage.setItem("age_ok_time", String(Date.now())); }catch(e){} }
    function shouldSkip(){
      try{ return Date.now() - (+localStorage.getItem("age_ok_time") || 0) < REMEMBER_TTL_MIN*60*1000; }
      catch(e){ return false; }
    }

    btnGo.addEventListener("click", function(e){
      if(!MONETAG_DIRECT_LINK){ e.preventDefault(); }   // tanpa link: hanya tutup popup
      rememberSkip();
      closeModal();
      vid.play().catch(function(){});                   // lanjut menonton di tab ini
    });
    btnNo.addEventListener("click", function(){
      rememberSkip();
      closeModal();
    });
    window.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

    window.addEventListener("load", function(){
      if(!shouldSkip()) setTimeout(showModal, AUTO_SHOW_DELAY_MS);
    });
  })();
  </script>
